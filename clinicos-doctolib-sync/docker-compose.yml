services:
  app_proxy:
    environment:
      APP_HOST: clinicos-doctolib-sync_web_1
      APP_PORT: 3081
      # Require an Umbrel session cookie on every request to port 3081 so
      # only operators who've already authenticated against the umbrel
      # itself can hit the doctolib-twin status surface. Defaults to "true"
      # when unset; explicit so a future drive-by edit can't disable it.
      PROXY_AUTH_ADD: "true"

  web:
    image: europe-west10-docker.pkg.dev/clinicos/clinicos-public/doctolib-twin:0.5.2
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "3081"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/session:/app/.session
    environment:
      TWIN_TOKEN: "${APP_TWIN_TOKEN}"
      DOCTOLIB_HEADLESS: "true"
      DOCTOLIB_OUTPUT_DIR: "/app/data"
    security_opt:
      - no-new-privileges=true
