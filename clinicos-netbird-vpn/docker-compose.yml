services:
  app_proxy:
    environment:
      APP_HOST: clinicos-netbird-vpn_web_1
      APP_PORT: 3082
      PROXY_AUTH_ADD: "false"

  web:
    image: europe-west10-docker.pkg.dev/clinicos/clinicos-public/vpn-agent:0.2.1
    restart: unless-stopped
    stop_grace_period: 10s
    expose:
      - "3082"
    volumes:
      # Read/write — the agent drives the netbird CLI via the host docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NETBIRD_CONTAINER: netbird-clinicos-vpn
      NB_MANAGEMENT_URL: https://vpn.nosc.ai
      # Fallback hostname for the raw-key path. Setup-tokens override this
      # with a cloud-assigned name.
      PEER_HOSTNAME: ${APP_PEER_HOSTNAME:-clinicos-edge}
    security_opt:
      - no-new-privileges=true
    depends_on:
      - netbird

  netbird:
    image: netbirdio/netbird:0.71.4
    container_name: netbird-clinicos-vpn
    restart: unless-stopped
    stop_grace_period: 10s
    network_mode: host
    # Run ONLY the daemon. The stock image entrypoint (netbird-entrypoint.sh)
    # starts the daemon and then runs a bare `netbird up` at boot. Because we
    # intentionally ship no NB_SETUP_KEY, that `up` fails, and under the
    # entrypoint's `set -e` the whole script aborts — its EXIT trap kills the
    # daemon and the container crash-loops. The /var/run/netbird.sock socket
    # then never persists, so the vpn-agent's `docker exec ... netbird up`
    # can't reach the daemon ("dial unix /var/run/netbird.sock: no such file")
    # and gets SIGKILLed (exit 137) when the container restarts.
    #
    # Bypassing the entrypoint to run `netbird service run` keeps the daemon up
    # persistently; the vpn-agent registers the peer over the socket once the
    # setup token is pasted in the UI.
    entrypoint: ["netbird"]
    command: ["service", "run"]
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      # Required for userspace mode and when the kernel module is unavailable.
      - /dev/net/tun
    volumes:
      # NetBird caches its rotated session credentials here after the first
      # `netbird up`. Persisting this volume means we re-connect automatically
      # across container restarts and Umbrel reboots.
      - ${APP_DATA_DIR}/netbird:/var/lib/netbird
    environment:
      NB_MANAGEMENT_URL: https://vpn.nosc.ai
      # Log to stdout so `docker logs netbird-clinicos-vpn` works (we bypass
      # the stock entrypoint, which would otherwise set this).
      NB_LOG_FILE: console
      # Intentionally NO NB_SETUP_KEY here. The daemon starts unregistered;
      # the vpn-agent injects the key by running `netbird up` once the
      # customer-success team pastes the setup token in the web UI.
