manifestVersion: 1
id: clinicos-netbird-vpn
category: networking
name: ClinicOS VPN Tunnel
version: "0.2.1"
tagline: Secure tunnel from this device to the ClinicOS cloud
icon: https://assets.clinicos.de/images/clinicos-icon.svg
description: >-
  ClinicOS VPN Tunnel joins this device to the ClinicOS private network
  over an encrypted WireGuard tunnel (powered by NetBird), making it
  reachable from the cloud backend without any port-forwarding or
  public DNS at the clinic.

  Required by all on-site ClinicOS apps that talk to the cloud over a
  direct connection — Doctolib Sync, easyTI Sync, DICOM Integration, and
  the device bridges.

  Setup: open the app and paste the setup token issued in
  ClinicOS Admin → Devices → VPN. The tunnel comes up in 5–10 seconds.
releaseNotes: "Upgrade NetBird to 0.71.4 (status dashboard updated for the new client schema). Adds an editable device-name suffix so each install registers under a distinct hostname; setup no longer hangs if the first connection is slow."
developer: NoscAI
website: https://clinicos.de
